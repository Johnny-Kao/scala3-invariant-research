name: Scala 3 Sorting differential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sorting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Scala CLI
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 https://github.com/VirtusLab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz -o /tmp/scala-cli.gz
          gzip -d /tmp/scala-cli.gz
          chmod +x /tmp/scala-cli
          /tmp/scala-cli version
      - name: Run identical behavior probe with 3.10.1
        run: |
          /tmp/scala-cli run tests/SortingDiff.scala --server=false --scala 3.10.1 --main-class main 2>&1 | tee /tmp/v-3.10.1.log
          grep 'CASES=' /tmp/v-3.10.1.log > /tmp/digest-old
      - name: Run identical behavior probe with 3.10.2-RC1
        run: |
          /tmp/scala-cli run tests/SortingDiff.scala --server=false --scala 3.10.2-RC1 --main-class main 2>&1 | tee /tmp/v-3.10.2-RC1.log
          grep 'CASES=' /tmp/v-3.10.2-RC1.log > /tmp/digest-new
      - name: Compare functional digests
        run: |
          cat /tmp/digest-old /tmp/digest-new
          diff -u /tmp/digest-old /tmp/digest-new
