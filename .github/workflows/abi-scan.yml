name: Scala 3 ABI research
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/abi_probe.py'
      - '.github/workflows/abi-scan.yml'
permissions:
  contents: read
jobs:
  abi-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download published Scala libraries
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for v in 3.9.0 3.10.1 3.10.2-RC1; do
            echo "FETCH $v"
            curl -fSL --retry 3 --connect-timeout 15 "https://repo.maven.apache.org/maven2/org/scala-lang/scala-library/$v/scala-library-$v.jar" -o "artifacts/scala-library-$v.jar"
          done
      - name: Compare exported JVM methods and fields
        run: python3 scripts/abi_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abi-diff
          path: results/
