name: Scala 3 HEAD post-fix ABI verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  head-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - name: Fetch pinned upstream Scala source
        run: |
          git clone --filter=blob:none --depth 1 https://github.com/scala/scala3.git /tmp/scala3
          cd /tmp/scala3
          echo "UPSTREAM_HEAD=$(git rev-parse HEAD)"
          git log -1 --format='%H %s'
          git log --oneline -n 1 -- library/src/scala/util/hashing/MurmurHash3.scala
      - name: Build Scala standard library from HEAD
        working-directory: /tmp/scala3
        env:
          JAVA_TOOL_OPTIONS: -Xmx5g
        run: |
          sbt -batch 'scala-library-bootstrapped / Compile / packageBin'
      - name: Locate built jar and inspect known bridges
        run: |
          set -euo pipefail
          find /tmp/scala3/library/target -type f -name '*.jar' | head -30
          jar=$(find /tmp/scala3/library/target -type f -name '*scala-library*.jar' | head -1)
          test -n "$jar"
          mkdir -p artifacts
          cp "$jar" artifacts/scala-library-HEAD.jar
          curl -fSL --retry 3 https://repo.maven.apache.org/maven2/org/scala-lang/scala-library/3.10.1/scala-library-3.10.1.jar -o artifacts/scala-library-3.10.1.jar
          curl -fSL --retry 3 https://repo.maven.apache.org/maven2/org/scala-lang/scala-library/3.10.2-RC1/scala-library-3.10.2-RC1.jar -o artifacts/scala-library-3.10.2-RC1.jar
          echo "JAR=$jar"
          javap -classpath "$jar" -public -s scala.util.hashing.MurmurHash3 | grep -E 'arrayHash|descriptor:' | head -42
      - name: Full selected-family JVM descriptor diff against actual HEAD
        run: |
          sed 's/VERSIONS = \["3.9.0", "3.10.1", "3.10.2-RC1"\]/VERSIONS = ["3.10.1", "3.10.2-RC1", "HEAD"]/' scripts/abi_probe.py > /tmp/abi_head.py
          python3 /tmp/abi_head.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scala-head-abi-diff
          path: results/

      - name: Compile old Java consumers against 3.10.2-RC1
        run: |
          set -euo pipefail
          mkdir -p /tmp/abi-consumers
          javac -cp artifacts/scala-library-3.10.2-RC1.jar -d /tmp/abi-consumers tests/abi/PublicObjectConsumer.java tests/abi/InternalClassConsumer.java
          echo 'JVM call owners in old-compiled consumers:'
          javap -classpath /tmp/abi-consumers -c PublicObjectConsumer InternalClassConsumer | grep -A 10 -E '(public static void main|arrayHash)'
      - name: Execute old bytecode against old and new runtime JARs
        run: |
          set -euo pipefail
          mkdir -p results
          for v in 3.10.2-RC1 HEAD; do
            echo "--- RUNTIME=$v ---"
            java -cp "/tmp/abi-consumers:artifacts/scala-library-$v.jar" PublicObjectConsumer 2>&1 | tee "results/public-$v.log"
            set +e
            java -cp "/tmp/abi-consumers:artifacts/scala-library-$v.jar" InternalClassConsumer > "results/internal-$v.log" 2>&1
            rc=$?
            set -e
            echo "INTERNAL_EXIT=$rc"
            cat "results/internal-$v.log"
          done
          echo '--- VERIFY PUBLIC API CROSS-RUNTIME ---'
          diff -u results/public-3.10.2-RC1.log results/public-HEAD.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: old-bytecode-runtime-results
          path: results/
