name: Scala3 independent production codegen invariants
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Scala CLI
        run: |
          curl -fL --retry 3 https://github.com/VirtusLab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz -o /tmp/scala-cli.gz
          gzip -d /tmp/scala-cli.gz
          chmod +x /tmp/scala-cli
      - name: Run codegen invariant tests across compiler versions
        env:
          COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2|https://repo.scala-lang.org/artifactory/maven-nightlies
        run: |
          set -euo pipefail
          mkdir -p results
          for v in 3.9.0 3.10.2-RC1 3.11.0-RC1-bin-20261119-90f3daf-NIGHTLY; do
            echo "VERSION=$v"
            /tmp/scala-cli run tests/IndependentCodegen.scala tests/QuoteCacheMacros.scala --server=false --scala "$v" --main-class independentCodegenMain > "results/codegen-$v.log" 2>&1 || { tail -70 "results/codegen-$v.log"; exit 1; }
            grep INDEPENDENT_CODEGEN_PASS "results/codegen-$v.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-codegen-results
          path: results/
