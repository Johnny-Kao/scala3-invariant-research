name: Scala 3 JVM backend invariant matrix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Scala CLI
        run: |
          curl -fL --retry 3 https://github.com/VirtusLab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz -o /tmp/scala-cli.gz
          gzip -d /tmp/scala-cli.gz
          chmod +x /tmp/scala-cli
      - name: Differential compilation and execution
        run: |
          set -euo pipefail
          mkdir -p results
          for v in 3.9.0 3.10.1 3.10.2-RC1; do
            /tmp/scala-cli run tests/JvmBackend.scala --server=false --scala "$v" --main-class jvmBackendMain > "results/jvm-$v.log" 2>&1 || { cat "results/jvm-$v.log"; exit 1; }
            grep 'JVM_CODEGEN_PASS' "results/jvm-$v.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-backend-results
          path: results/
