name: Scala 3 compiler metamorphic correctness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Scala CLI
        run: |
          curl -fL --retry 3 --connect-timeout 20 https://github.com/VirtusLab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz -o /tmp/scala-cli.gz
          gzip -d /tmp/scala-cli.gz
          chmod +x /tmp/scala-cli
      - name: Check inline and plain-language invariants over 3 releases
        run: |
          set -euo pipefail
          mkdir -p results
          for v in 3.9.0 3.10.1 3.10.2-RC1; do
            echo "COMPILER_VERSION=$v"
            /tmp/scala-cli run tests/CompilerInvariant.scala --server=false --scala "$v" --main-class compilerInvariantMain > "results/compiler-$v.log" 2>&1 || { cat "results/compiler-$v.log"; exit 1; }
            grep 'COMPILER_INVARIANTS_PASS' "results/compiler-$v.log"
          done
          sha256sum results/compiler-*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-metamorphic
          path: results/
